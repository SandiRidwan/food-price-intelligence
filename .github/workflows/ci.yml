name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile check
        run: python -m compileall -q src app tests

      - name: Audit narasi (Kenapa·Tujuan·Dampak & Insight)
        run: |
          python src/explanations.py
          python -c "import sys; sys.path.insert(0,'src'); import insights_content; import insight; sys.exit(0 if insight.audit() else 1)"

      # Ingest World Bank + Frankfurter (publik, TANPA kredensial), lalu muat
      # & transform. Data BPS dilewati otomatis bila BPS_API_KEY tidak diset.
      - name: Rebuild warehouse (World Bank + FX)
        env:
          BPS_API_KEY: ${{ secrets.BPS_API_KEY }}
        run: python src/run_pipeline.py --no-charts

      - name: Data quality tests
        run: python tests/test_data_quality.py
